name: Release

# Publishing is driven by a tag: `git tag v1.2.3 && git push origin v1.2.3`.
# The tag name (minus the leading `v`) becomes the plugin version, so the zip inside the
# release matches the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ github.event.inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test -PpluginVersion=${{ steps.version.outputs.version }} --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.version }} --console=plain

      - name: Verify plugin
        run: ./gradlew verifyPlugin -PpluginVersion=${{ steps.version.outputs.version }} --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # workflow_dispatch has no tag behind it; create one so the release points at a commit.
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            build/distributions/helm-global-vars-"$VERSION".zip
