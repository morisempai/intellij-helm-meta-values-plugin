name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Downloads of the IntelliJ IDEA distribution and of the IDEs used by the plugin verifier
      # are the slow part of this job; both live under ~/.gradle and are cached by setup-gradle.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Verify plugin
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: helm-global-vars
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/**
            build/reports/pluginVerifier/**
          if-no-files-found: ignore
