settings.enabled=Enable Helm global variable support
settings.meta.files.group=Meta values files
settings.meta.files.comment=One path per line, relative to the project root or absolute. Leave empty to use the convention: .helm-globals.yaml / .helm-globals.yml in the project root or any content root.
settings.values.globs.group=Templated values files
settings.values.globs.comment=Glob patterns (one per line) selecting the files this plugin analyses. Leave empty for the defaults: values*.y*ml and *values*.y*ml anywhere in the project.
settings.root.label=Variable root under .Values (optional):
settings.root.comment=Leave empty to complete and validate every {{ .Values.* }} path against the meta file. Set it to narrow the scope: with "global", only {{ .Values.global.* }} is analysed and everything else is left alone.
settings.inlay.hints=Show resolved values as inline hints
settings.detected.header=Resolved meta files:
